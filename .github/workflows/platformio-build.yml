name: PlatformIO Build

on:
  push:
    branches:
      - docs/shqip-komentet
  pull_request:
    branches:
      - docs/shqip-komentet
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 ORA
    runs-on: ubuntu-latest
    steps:
      - name: Shkarko kodin
        uses: actions/checkout@v4

      - name: Konfiguro Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalo PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Krijo skedarin privat të Tuya-s
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          names = ("TUYA_CLIENT_ID", "TUYA_CLIENT_SECRET", "TUYA_DEVICE_ID")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Mungojnë GitHub Actions Secrets: " + ", ".join(missing)
              )

          lines = [
              "#pragma once",
              "",
              f'#define TUYA_CLIENT_ID {json.dumps(os.environ["TUYA_CLIENT_ID"])}',
              f'#define TUYA_CLIENT_SECRET {json.dumps(os.environ["TUYA_CLIENT_SECRET"])}',
              f'#define TUYA_DEVICE_ID {json.dumps(os.environ["TUYA_DEVICE_ID"])}',
              "",
              '#define TUYA_API_HOST "openapi.tuyaeu.com"',
              "",
          ]
          Path("src/secrets.h").write_text("\\n".join(lines), encoding="utf-8")
          PY

      - name: Kompilo projektin
        run: pio run -e esp32-s3-devkitc-1
