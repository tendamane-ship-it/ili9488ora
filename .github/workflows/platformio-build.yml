name: PlatformIO Build

on:
  push:
    branches:
      - docs/shqip-komentet
  pull_request:
    branches:
      - docs/shqip-komentet
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 ORA
    runs-on: ubuntu-latest
    steps:
      - name: Shkarko kodin
        uses: actions/checkout@v4

      - name: Konfiguro Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalo PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Krijo secrets.h për build-in
        env:
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_CLIENT_SECRET: ${{ secrets.TUYA_CLIENT_SECRET }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Kredencialet reale janë opsionale për kompajlim.
          # Pa to, integrimi Tuya nuk do të autentikohet.
          values = {
              "TUYA_CLIENT_ID": os.environ.get("TUYA_CLIENT_ID") or "",
              "TUYA_CLIENT_SECRET": os.environ.get("TUYA_CLIENT_SECRET") or "",
              "TUYA_DEVICE_ID": os.environ.get("TUYA_DEVICE_ID") or "",
          }

          lines = [
              "#pragma once",
              "",
              f'#define TUYA_CLIENT_ID {json.dumps(values["TUYA_CLIENT_ID"])}',
              f'#define TUYA_CLIENT_SECRET {json.dumps(values["TUYA_CLIENT_SECRET"])}',
              f'#define TUYA_DEVICE_ID {json.dumps(values["TUYA_DEVICE_ID"])}',
              "",
              '#define TUYA_API_HOST "openapi.tuyaeu.com"',
              "",
          ]
          Path("src/secrets.h").write_text("\n".join(lines), encoding="utf-8")
          print("U krijua secrets.h për kompajlim; kredencialet Tuya janë opsionale.")
          PY

      - name: Kompilo projektin
        run: pio run -e esp32-s3-devkitc-1
